name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CLAUDE_ROSLYN_LSP_LIVE_TESTS: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-24_04:
    name: ubuntu-24_04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props', 'src/ClaudeRoslynLsp/Roslyn/RoslynServerManifest.cs') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Test, SmokeTest, LiveTest, Pack'
        run: dotnet fallout Test SmokeTest LiveTest Pack
