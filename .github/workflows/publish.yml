name: publish

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NUGET_USER: lahma

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Compile, Test, Pack, Publish, PublishMcpRegistry'
        run: dotnet fallout Compile Test Pack Publish PublishMcpRegistry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
