# ~/.codex/config.toml - claude-roslyn-lsp as an MCP server for Codex CLI.
# Both timeouts are raised on purpose: the defaults are 10 s and 60 s, and a cold solution load
# can take up to the adapter's own 120 s readiness budget.
[mcp_servers.roslyn]
command = "/usr/local/bin/claude-roslyn-lsp"
args = ["mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 180
